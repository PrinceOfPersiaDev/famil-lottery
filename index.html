<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خروجی خانه - قرعه‌کشی iOS Glass</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-green: #34c759;
      --accent-blue: #0a84ff;
      --accent-red: #ff453a;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #1c1c1e, #000000);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      padding: 20px;
      border-radius: 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-top: 0;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .status-online {
      font-size: 0.75rem;
      color: var(--accent-green);
      text-align: center;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }

    .card-header {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slot-display {
      font-size: 1.7rem;
      font-weight: 800;
      text-align: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffd60a;
      min-height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 15px rgba(255, 214, 10, 0.3);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      box-sizing: border-box;
      font-size: 0.95rem;
      margin-bottom: 8px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-blue);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--accent-green); color: #fff; }
    .btn-admin { background: var(--accent-blue); color: #fff; margin-top: 6px; }

    /* دکمه آیکونی حذف مدرن (Glass Circle Delete) */
    .btn-delete-item {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid rgba(255, 69, 58, 0.3);
      color: var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      padding: 0;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-delete-item:hover {
      background: var(--accent-red);
      color: #fff;
      transform: scale(1.1);
    }

    ul { list-style: none; padding: 0; margin: 0; max-height: 190px; overflow-y: auto; }
    
    li {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      backdrop-filter: blur(5px);
    }

    .badge {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 8px;
      margin-left: 8px;
    }

    .item-right {
      display: flex;
      align-items: center;
    }

    .footer { text-align: center; margin-top: 10px; }
    .footer button { background: none; color: var(--text-muted); font-size: 0.8rem; width: auto; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎰 خروجی خانه</h1>
  <div class="status-online">🟢 متصل به دیتابیس آنلاین</div>

  <!-- نمایشگر نتیجه -->
  <div class="glass-card">
    <div class="slot-display" id="slot-screen">منتظر شروع...</div>
  </div>

  <!-- پنل مدیریت -->
  <div id="admin-panel" class="glass-card" style="display: none; border-color: rgba(10, 132, 255, 0.4);">
    <div class="card-header" style="color: var(--accent-blue);">👑 پنل مدیریت</div>
    <input type="text" id="new-name" placeholder="نام فرد جدید...">
    <button class="btn-primary" onclick="addMember()">+ افزودن به لیست</button>
    <button class="btn-admin" id="draw-btn" onclick="triggerOnlineDraw()">🎉 قرعه‌کشی آنلاین</button>
  </div>

  <!-- لیست افراد حاضر با دکمه حذف تکی -->
  <div class="glass-card">
    <div class="card-header">
      <span>📋 افراد حاضر</span>
      <span id="active-count" style="color: var(--accent-blue); font-weight: bold;">0</span>
    </div>
    <ul id="active-list"></ul>
  </div>

  <!-- بایگانی برندگان با دکمه حذف تکی -->
  <div class="glass-card">
    <div class="card-header">🏆 بایگانی برندگان</div>
    <ul id="archive-list"></ul>
  </div>

  <div class="footer">
    <button id="login-toggle" onclick="loginAdmin()">ورود سریع مدیر</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBOwqg1NbzaZZqARR-fygAJJmyPcOE6xPo",
    authDomain: "famil-lottery.firebaseapp.com",
    databaseURL: "https://famil-lottery-default-rtdb.firebaseio.com",
    projectId: "famil-lottery",
    storageBucket: "famil-lottery.firebasestorage.app",
    messagingSenderId: "814960622704",
    appId: "1:814960622704:web:572e36a3a543df2626c8b5",
    measurementId: "G-5QBMWCNECX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let isAdmin = false;
  const ADMIN_PASS = "594572";
  const ADMIN_SECRET_KEY = "594572";

  let activeMembers = [];
  let archivedMembers = [];

  onValue(ref(db, 'lotteryData'), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      activeMembers = data.activeMembers || [];
      archivedMembers = data.archivedMembers || [];
      render();

      if (data.currentWinner) {
        showWinnerAnimation(data.currentWinner);
      }
    } else {
      activeMembers = [];
      archivedMembers = [];
      render();
    }
  });

  function pushToDatabase(currentWinnerName = null) {
    const payload = {
      activeMembers: activeMembers,
      archivedMembers: archivedMembers,
      adminKey: ADMIN_SECRET_KEY,
      timestamp: Date.now()
    };
    if (currentWinnerName) payload.currentWinner = currentWinnerName;
    set(ref(db, 'lotteryData'), payload);
  }

  window.loginAdmin = function() {
    const pass = prompt("رمز مدیر را وارد کنید:");
    if (pass === ADMIN_PASS) {
      isAdmin = true;
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('login-toggle').style.display = 'none';
      render();
    } else if (pass !== null) {
      alert("رمز اشتباه است!");
    }
  };

  window.addMember = function() {
    const input = document.getElementById('new-name');
    const name = input.value.trim();
    if (name) {
      activeMembers.push(name);
      input.value = '';
      pushToDatabase();
    }
  };

  // حذف تکی فرد حاضر
  window.removeActiveMember = function(index) {
    if (!isAdmin) return;
    activeMembers.splice(index, 1);
    pushToDatabase();
  };

  // حذف تکی از بایگانی
  window.removeArchivedMember = function(index) {
    if (!isAdmin) return;
    archivedMembers.splice(index, 1);
    pushToDatabase();
  };

  window.triggerOnlineDraw = function() {
    if (activeMembers.length === 0) {
      alert("لیست حاضران خالی است!");
      return;
    }

    const array = new Uint32Array(1);
    window.crypto.getRandomValues(array);
    const randomIndex = array[0] % activeMembers.length;
    const winner = activeMembers[randomIndex];

    activeMembers.splice(randomIndex, 1);
    const timeStr = new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
    archivedMembers.unshift({ name: winner, time: timeStr });

    pushToDatabase(winner);
  };

  function showWinnerAnimation(winnerName) {
    const screen = document.getElementById('slot-screen');
    let counter = 0;
    const speed = 70;
    const totalRuns = 22;

    const interval = setInterval(() => {
      if(activeMembers.length > 0) {
        screen.innerText = activeMembers[counter % activeMembers.length];
      }
      counter++;

      if (counter > totalRuns) {
        clearInterval(interval);
        screen.innerText = "🎉 " + winnerName;
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      }
    }, speed);
  }

  function render() {
    // لیست افراد حاضر
    const activeUl = document.getElementById('active-list');
    activeUl.innerHTML = '';
    activeMembers.forEach((name, index) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span>${name}</span>
        ${isAdmin ? `<button class="btn-delete-item" title="حذف این فرد" onclick="removeActiveMember(${index})">✕</button>` : ''}
      `;
      activeUl.appendChild(li);
    });
    document.getElementById('active-count').innerText = activeMembers.length;

    // لیست بایگانی برندگان
    const archiveUl = document.getElementById('archive-list');
    archiveUl.innerHTML = '';
    archivedMembers.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span>${item.name}</span>
        <div class="item-right">
          <span class="badge">${item.time}</span>
          ${isAdmin ? `<button class="btn-delete-item" title="حذف از بایگانی" onclick="removeArchivedMember(${index})">✕</button>` : ''}
        </div>
      `;
      archiveUl.appendChild(li);
    });
  }
</script>

</body>
</html>
