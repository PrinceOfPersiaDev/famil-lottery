<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرعه‌کشی آنلاین و شفاف خانوادگی</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #10b981;
      --accent-hover: #059669;
      --primary: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(to right, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-online {
      font-size: 0.75rem;
      color: #34d399;
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slot-display {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
      border: 2px solid #334155;
      color: #f59e0b;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    input, button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: var(--text);
      box-sizing: border-box;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      background: var(--accent-hover);
    }

    .btn-admin {
      background: var(--primary);
    }

    .btn-danger {
      background: #ef4444;
      padding: 4px 10px;
      width: auto;
      font-size: 0.8rem;
      margin: 0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 180px;
      overflow-y: auto;
    }

    li {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .badge {
      font-size: 0.75rem;
      background: rgba(52, 211, 153, 0.1);
      color: #34d399;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
    }

    .footer button {
      background: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      width: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎰 قرعه‌کشی خانوادگی</h1>
  <div class="status-online">🟢 متصل به دیتابیس لایو فایربیس</div>

  <!-- نمایشگر هیجان/برنده -->
  <div class="card">
    <div class="slot-display" id="slot-screen">منتظر شروع قرعه‌کشی...</div>
  </div>

  <!-- پنل مدیر (مخفی) -->
  <div id="admin-panel" class="card" style="display: none; border-color: var(--primary);">
    <div class="card-title" style="color: #60a5fa;">👑 پنل مدیریتی</div>
    <input type="text" id="new-name" placeholder="نام فرد جدید...">
    <button onclick="addMember()">+ ثبت نام جدید</button>
    <button class="btn-admin" id="draw-btn" onclick="triggerOnlineDraw()" style="margin-top: 10px;">🎉 استارت هم‌زمان قرعه‌کشی برای همه</button>
  </div>

  <!-- لیست حاضران -->
  <div class="card">
    <div class="card-title">
      <span>📋 افراد حاضر</span>
      <span id="active-count" style="color: #60a5fa; font-weight: bold;">0</span>
    </div>
    <ul id="active-list"></ul>
  </div>

  <!-- بایگانی برندگان -->
  <div class="card">
    <div class="card-title">🏆 بایگانی برندگان</div>
    <ul id="archive-list"></ul>
  </div>

  <div class="footer">
    <button id="login-toggle" onclick="loginAdmin()">ورود مدیر</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // تنظیمات اختصاصی فایربیس شما
  const firebaseConfig = {
    apiKey: "AIzaSyBOwqg1NbzaZZqARR-fygAJJmyPcOE6xPo",
    authDomain: "famil-lottery.firebaseapp.com",
    databaseURL: "https://famil-lottery-default-rtdb.firebaseio.com",
    projectId: "famil-lottery",
    storageBucket: "famil-lottery.firebasestorage.app",
    messagingSenderId: "814960622704",
    appId: "1:814960622704:web:572e36a3a543df2626c8b5",
    measurementId: "G-5QBMWCNECX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let isAdmin = false;
  const ADMIN_PASS = "1234";

  let activeMembers = [];
  let archivedMembers = [];

  // همگام‌سازی لحظه‌ای با دیتابیس
  onValue(ref(db, 'lotteryData'), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      activeMembers = data.activeMembers || [];
      archivedMembers = data.archivedMembers || [];
      render();

      if (data.currentWinner) {
        showWinnerAnimation(data.currentWinner);
      }
    }
  });

  function pushToDatabase() {
    set(ref(db, 'lotteryData'), {
      activeMembers: activeMembers,
      archivedMembers: archivedMembers,
      timestamp: Date.now()
    });
  }

  window.loginAdmin = function() {
    const pass = prompt("رمز مدیر را وارد کنید:");
    if (pass === ADMIN_PASS) {
      isAdmin = true;
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('login-toggle').style.display = 'none';
      render();
    } else if (pass !== null) {
      alert("رمز اشتباه است!");
    }
  };

  window.addMember = function() {
    const input = document.getElementById('new-name');
    const name = input.value.trim();
    if (name) {
      activeMembers.push(name);
      input.value = '';
      pushToDatabase();
    }
  };

  window.removeMember = function(index) {
    if (!isAdmin) return;
    activeMembers.splice(index, 1);
    pushToDatabase();
  };

  window.triggerOnlineDraw = function() {
    if (activeMembers.length === 0) {
      alert("لیست حاضران خالی است!");
      return;
    }

    const array = new Uint32Array(1);
    window.crypto.getRandomValues(array);
    const randomIndex = array[0] % activeMembers.length;
    const winner = activeMembers[randomIndex];

    activeMembers.splice(randomIndex, 1);
    const timeStr = new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
    archivedMembers.unshift({ name: winner, time: timeStr });

    set(ref(db, 'lotteryData'), {
      activeMembers: activeMembers,
      archivedMembers: archivedMembers,
      currentWinner: winner,
      timestamp: Date.now()
    });
  };

  function showWinnerAnimation(winnerName) {
    const screen = document.getElementById('slot-screen');
    let counter = 0;
    const speed = 70;
    const totalRuns = 22;

    const interval = setInterval(() => {
      if(activeMembers.length > 0) {
        screen.innerText = activeMembers[counter % activeMembers.length];
      }
      counter++;

      if (counter > totalRuns) {
        clearInterval(interval);
        screen.innerText = "🎉 " + winnerName;
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      }
    }, speed);
  }

  function render() {
    const activeUl = document.getElementById('active-list');
    activeUl.innerHTML = '';
    activeMembers.forEach((name, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${name}</span> ${isAdmin ? `<button class="btn-danger" onclick="removeMember(${index})">حذف</button>` : ''}`;
      activeUl.appendChild(li);
    });
    document.getElementById('active-count').innerText = activeMembers.length;

    const archiveUl = document.getElementById('archive-list');
    archiveUl.innerHTML = '';
    archivedMembers.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${item.name}</span> <span class="badge">${item.time}</span>`;
      archiveUl.appendChild(li);
    });
  }
</script>

</body>
</html>
