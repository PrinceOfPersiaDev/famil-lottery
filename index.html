<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خروجی خانه - قرعه‌کشی خانوادگی</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-green: #34c759;
      --accent-blue: #0a84ff;
      --accent-red: #ff453a;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #1c1c1e, #000000);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      padding: 20px;
      border-radius: 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 { font-size: 1.4rem; margin: 0; font-weight: 700; }
    
    .btn-settings {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: #fff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .status-online {
      font-size: 0.75rem;
      color: var(--accent-green);
      text-align: center;
      margin-bottom: 16px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-header {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slot-display {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffd60a;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      box-sizing: border-box;
      font-size: 0.95rem;
      margin-bottom: 8px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent-green); color: #fff; }
    .btn-admin { background: var(--accent-blue); color: #fff; margin-top: 6px; }

    .btn-delete-item {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      background: rgba(255, 69, 58, 0.2);
      border: 1px solid rgba(255, 69, 58, 0.4);
      color: var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
    }

    ul { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
    li {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    /* Drawer چپ برای تنظیمات */
    .drawer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 80%;
      height: 100%;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      border-radius: 30px 0 0 30px;
      padding: 20px;
      box-sizing: border-box;
      transition: left 0.3s ease;
      z-index: 10;
    }

    .drawer.open { left: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="container" id="main-card">
  <!-- منوی کشویی تنظیمات (از چپ باز می‌شود) -->
  <div class="drawer" id="settings-drawer">
    <div class="drawer-header">
      <h3>⚙️ تنظیمات</h3>
      <button class="btn-delete-item" onclick="toggleDrawer()">✕</button>
    </div>
    <label style="font-size: 0.85rem; color: var(--text-muted);">تغییر نام کاربری مدیر:</label>
    <input type="text" id="admin-username-input" value="مدیر اصلی">
    
    <label style="font-size: 0.85rem; color: var(--text-muted); margin-top: 10px; display:block;">تغییر رمز عبور:</label>
    <input type="password" id="admin-pass-input" placeholder="رمز جدید...">
    
    <button class="btn-primary" onclick="saveSettings()" style="margin-top: 15px;">ذخیره تنظیمات</button>
  </div>

  <div class="header-bar">
    <h1>🎰 خروجی خانه</h1>
    <button class="btn-settings" onclick="toggleDrawer()">⚙️</button>
  </div>
  <div class="status-online">🟢 متصل به دیتابیس لایو</div>

  <div class="glass-card">
    <div class="slot-display" id="slot-screen">منتظر شروع...</div>
  </div>

  <div id="admin-panel" class="glass-card" style="display: none; border-color: rgba(10, 132, 255, 0.4);">
    <div class="card-header" style="color: var(--accent-blue);">👑 پنل مدیریت</div>
    <input type="text" id="new-name" placeholder="نام فرد جدید...">
    <button class="btn-primary" onclick="addMember()">+ افزودن نام</button>
    <button class="btn-admin" onclick="triggerOnlineDraw()">🎉 شروع قرعه‌کشی (۴۵ ثانیه‌ای)</button>
  </div>

  <div class="glass-card">
    <div class="card-header">
      <span>📋 افراد حاضر</span>
      <span id="active-count" style="color: var(--accent-blue); font-weight: bold;">0</span>
    </div>
    <ul id="active-list"></ul>
  </div>

  <div class="glass-card">
    <div class="card-header">🏆 بایگانی برندگان</div>
    <ul id="archive-list"></ul>
  </div>

  <div style="text-align: center;">
    <button id="login-toggle" onclick="loginAdmin()" style="background: none; color: var(--text-muted); width: auto; font-size: 0.8rem;">ورود مدیر</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBOwqg1NbzaZZqARR-fygAJJmyPcOE6xPo",
    authDomain: "famil-lottery.firebaseapp.com",
    databaseURL: "https://famil-lottery-default-rtdb.firebaseio.com",
    projectId: "famil-lottery",
    storageBucket: "famil-lottery.firebasestorage.app",
    messagingSenderId: "814960622704",
    appId: "1:814960622704:web:572e36a3a543df2626c8b5",
    measurementId: "G-5QBMWCNECX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let isAdmin = false;
  let ADMIN_PASS = "594572";
  let activeMembers = [];
  let archivedMembers = [];

  onValue(ref(db, 'lotteryData'), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // جلوگیری از پاک شدن ورودی موقع تایپ
      if (document.activeElement.id !== 'new-name') {
        activeMembers = data.activeMembers || [];
        archivedMembers = data.archivedMembers || [];
        render();
      }

      if (data.currentWinner) {
        showWinnerAnimation(data.currentWinner);
      }
    }
  });

  function pushToDatabase(currentWinnerName = null) {
    const payload = {
      activeMembers: activeMembers,
      archivedMembers: archivedMembers,
      adminKey: "594572",
      timestamp: Date.now()
    };
    if (currentWinnerName) payload.currentWinner = currentWinnerName;
    set(ref(db, 'lotteryData'), payload);
  }

  window.toggleDrawer = function() {
    document.getElementById('settings-drawer').classList.toggle('open');
  };

  window.saveSettings = function() {
    const newPass = document.getElementById('admin-pass-input').value;
    if (newPass.trim() !== '') {
      ADMIN_PASS = newPass.trim();
      alert("رمز جدید ثبت شد!");
    }
    toggleDrawer();
  };

  window.loginAdmin = function() {
    const pass = prompt("رمز مدیر را وارد کنید:");
    if (pass === ADMIN_PASS) {
      isAdmin = true;
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('login-toggle').style.display = 'none';
      render();
    } else if (pass !== null) {
      alert("رمز اشتباه است!");
    }
  };

  window.addMember = function() {
    const input = document.getElementById('new-name');
    const name = input.value.trim();
    if (name) {
      activeMembers.push(name);
      input.value = '';
      render();
      pushToDatabase();
    }
  };

  window.removeActiveMember = function(index) {
    if (!isAdmin) return;
    activeMembers.splice(index, 1);
    render();
    pushToDatabase();
  };

  window.removeArchivedMember = function(index) {
    if (!isAdmin) return;
    archivedMembers.splice(index, 1);
    render();
    pushToDatabase();
  };

  window.triggerOnlineDraw = function() {
    if (activeMembers.length === 0) {
      alert("لیست خالی است!");
      return;
    }

    const randomIndex = Math.floor(Math.random() * activeMembers.length);
    const winner = activeMembers[randomIndex];

    activeMembers.splice(randomIndex, 1);
    const timeStr = new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
    archivedMembers.unshift({ name: winner, time: timeStr });

    pushToDatabase(winner);
  };

  function showWinnerAnimation(winnerName) {
    const screen = document.getElementById('slot-screen');
    let counter = 0;
    const speed = 80;
    const totalDuration = 45000; // دقیقاً ۴۵ ثانیه
    const startTime = Date.now();

    const interval = setInterval(() => {
      if(activeMembers.length > 0) {
        screen.innerText = activeMembers[counter % activeMembers.length];
      }
      counter++;

      if (Date.now() - startTime >= totalDuration) {
        clearInterval(interval);
        screen.innerText = "🎉 " + winnerName;
        confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

        // اسکرین‌شات اتوماتیک پس از اعلام برنده
        setTimeout(() => {
          html2canvas(document.getElementById('main-card')).then(canvas => {
            const link = document.createElement('a');
            link.download = `Winner-${winnerName}.png`;
            link.href = canvas.toDataURL();
            link.click();
          });
        }, 1200);
      }
    }, speed);
  }

  function render() {
    const activeUl = document.getElementById('active-list');
    activeUl.innerHTML = '';
    activeMembers.forEach((name, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${name}</span> ${isAdmin ? `<button class="btn-delete-item" onclick="removeActiveMember(${index})">✕</button>` : ''}`;
      activeUl.appendChild(li);
    });
    document.getElementById('active-count').innerText = activeMembers.length;

    const archiveUl = document.getElementById('archive-list');
    archiveUl.innerHTML = '';
    archivedMembers.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${item.name}</span> ${isAdmin ? `<button class="btn-delete-item" onclick="removeArchivedMember(${index})">✕</button>` : ''}`;
      archiveUl.appendChild(li);
    });
  }
</script>

</body>
</html>
