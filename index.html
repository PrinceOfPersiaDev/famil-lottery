<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرعه‌کشی خانوادگی</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #27ae60;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .section {
      background: #f1f3f5;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .admin-panel {
      border: 2px dashed #3498db;
      background: #ebf5fb;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #ced4da;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-danger {
      background-color: #e74c3c;
      width: auto;
      padding: 4px 10px;
      font-size: 0.8rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
    }
    li {
      background: white;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e9ecef;
    }
    .winner-item {
      border-right: 4px solid var(--accent);
    }
    .time-badge {
      font-size: 0.75rem;
      color: #6c757d;
      background: #e9ecef;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .admin-toggle {
      text-align: center;
      margin-top: 15px;
    }
    .admin-toggle button {
      background: none;
      color: #6c757d;
      text-decoration: underline;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎲 قرعه‌کشی خانوادگی</h1>

  <!-- پنل مدیریت (پیش‌فرض مخفی) -->
  <div id="admin-section" class="section admin-panel" style="display: none;">
    <h3 style="margin-top:0;">👑 پنل مدیریت</h3>
    <input type="text" id="new-name" placeholder="نام و نام خانوادگی فرد جدید...">
    <button onclick="addMember()">+ افزودن به لیست</button>
    <button onclick="runLottery()" style="background-color: #2980b9; margin-top: 10px;">🎉 استارت قرعه‌کشی</button>
  </div>

  <!-- لیست حاضران در قرعه‌کشی -->
  <div class="section">
    <h3 style="margin-top:0;">📋 افراد حاضر در قرعه‌کشی (<span id="active-count">0</span>)</h3>
    <ul id="active-list"></ul>
  </div>

  <!-- بایگانی برندگان -->
  <div class="section">
    <h3 style="margin-top:0;">🏆 بایگانی برندگان</h3>
    <ul id="archive-list"></ul>
  </div>

  <!-- دکمه ورود مدیر -->
  <div class="admin-toggle" id="login-btn-container">
    <button onclick="loginAdmin()">ورود مدیر</button>
  </div>
</div>

<script>
  let isAdmin = false;
  // رمز ورود مدیر (می‌توانی تغییر دهی)
  const ADMIN_PASS = "1234";

  let activeMembers = JSON.parse(localStorage.getItem('activeMembers')) || ["علی", "مریم", "رضا", "سارا"];
  let archivedMembers = JSON.parse(localStorage.getItem('archivedMembers')) || [];

  function saveData() {
    localStorage.setItem('activeMembers', JSON.stringify(activeMembers));
    localStorage.setItem('archivedMembers', JSON.stringify(archivedMembers));
    render();
  }

  function loginAdmin() {
    const pass = prompt("رمز عبور مدیر را وارد کنید:");
    if (pass === ADMIN_PASS) {
      isAdmin = true;
      document.getElementById('admin-section').style.display = 'block';
      document.getElementById('login-btn-container').style.display = 'none';
      render();
    } else if (pass !== null) {
      alert("رمز عبور اشتباه است!");
    }
  }

  function addMember() {
    const input = document.getElementById('new-name');
    const name = input.value.trim();
    if (name) {
      activeMembers.push(name);
      input.value = '';
      saveData();
    }
  }

  function removeMember(index) {
    if (!isAdmin) return;
    activeMembers.splice(index, 1);
    saveData();
  }

  function runLottery() {
    if (activeMembers.length === 0) {
      alert("هیچ فردی در لیست فعال وجود ندارد!");
      return;
    }

    // قرعه‌کشی با کریپتوگرافی مرورگر برای شانس ۱۰۰٪ برابر
    const array = new Uint32Array(1);
    window.crypto.getRandomValues(array);
    const randomIndex = array[0] % activeMembers.length;

    const winner = activeMembers[randomIndex];
    activeMembers.splice(randomIndex, 1);

    const date = new Date().toLocaleDateString('fa-IR') + ' - ' + new Date().toLocaleTimeString('fa-IR', {hour: '2-digit', minute:'2-digit'});
    archivedMembers.unshift({ name: winner, time: date });

    saveData();
    alert(`🎉 برنده قرعه‌کشی: ${winner}`);
  }

  function render() {
    // رندر لیست فعال
    const activeUl = document.getElementById('active-list');
    activeUl.innerHTML = '';
    activeMembers.forEach((name, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${name}</span> ${isAdmin ? `<button class="btn-danger" onclick="removeMember(${index})">حذف</button>` : ''}`;
      activeUl.appendChild(li);
    });
    document.getElementById('active-count').innerText = activeMembers.length;

    // رندر لیست بایگانی
    const archiveUl = document.getElementById('archive-list');
    archiveUl.innerHTML = '';
    archivedMembers.forEach(item => {
      const li = document.createElement('li');
      li.className = 'winner-item';
      li.innerHTML = `<strong>${item.name}</strong> <span class="time-badge">${item.time}</span>`;
      archiveUl.appendChild(li);
    });
  }

  render();
</script>

</body>
</html>
